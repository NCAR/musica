# Combined CAMS (anthropogenic + biogenic) + FINN (fire) emissions config
# covering every MVP variable in
# /glade/work/smeech/mpas/example_uptempo_data/{CAMS,FINN}/MPAS_READY, used by
# python/musica/examples/miem_cams_finn_box_model_real_fixture.py and
# python/test/unit/miem/test_cams_finn_all_species_real_fixtures.py.
#
# "file pattern" entries are bare filenames (directory: "") -- both scripts
# resolve the YAML's own directory via find_config_path and temporarily chdir
# into it before calling Emissions.run(), the same convention the Fortran
# examples use with a CMake-fixed working directory (see
# nox_real_fixture_emissions_config.yaml).
#
# Every source below gets its own category (0-13) even though several
# mechanism species (MTERP, CO, ISOP, NH3, SO2, BC, OC) are fed by more than
# one source: MIEM sums flux across categories unconditionally but only
# arbitrates (highest-hierarchy-wins) *within* a shared category. Anthropogenic
# combustion, biogenic vegetation, and biomass burning are independent real
# physical processes that must all add together, not override one another --
# giving each source a unique category is what makes that hold regardless of
# how many sources happen to touch the same species.
#
# Only each anthropogenic file's "_sum" variable is mapped (never the
# individual "_awb"/"_res"/etc. sector variables) -- measured directly against
# the source data that "_sum" is not simply awb+res (ratios from 0.007 to 1.7
# across species), so it aggregates additional sectors not broken out here.
#
# Black carbon (BC) and organic carbon (OC) are aerosol mass with no
# gas-phase representation in ts1.json -- they still get real miem flux like
# every other species, they just have no MICM Emission reaction attached to
# them by the consuming scripts (flux-only, no concentration curve).
version: 1.0.0
species: []
phases: []
reactions: []
emissions:
  inventories:
    - name: cams anth ammonia
      directory: ""
      file pattern: "x1.163842_2024_cams_anth_ammonia_subset.nc"
      convention: uptempo
    - name: cams anth black carbon
      directory: ""
      file pattern: "x1.163842_2024_cams_anth_black-carbon_subset.nc"
      convention: uptempo
    - name: cams anth carbon monoxide
