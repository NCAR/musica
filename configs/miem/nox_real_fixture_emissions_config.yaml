# Used by fortran/examples/miem_nox_box_model_real_fixture.F90, whose CWD is
# ${CMAKE_BINARY_DIR}/configs/tuvx -- "file pattern" below is relative to that.
# Same real fixture + 9:1 NO:NO2 split as
# src/test/unit/miem/emissions_model_end_to_end_nox.cpp and
# python/musica/examples/miem_nox_box_model_real_fixture.py, but with
# temporal interpolation: linear (rather than none) to exercise
# OfflineEmissionSource's real bracket/interpolation path.
version: 1.0.0
species: []
phases: []
reactions: []
emissions:
  inventories:
    - name: nox subset
      directory: ""
      file pattern: "../miem/x1.163842_2024_nox_subset.nc"
      convention: uptempo
  species maps:
    - name: nox map
      mappings:
        - inventory species: nox_anth_sum
          mechanism species: NO
          scaling factor: 0.9
        - inventory species: nox_anth_sum
          mechanism species: NO2
          scaling factor: 0.1
  regridding:
    type: none
  sources:
    - name: nox source
      mode: offline
      type: anthropogenic
      inventory: nox subset
      species map: nox map
      temporal interpolation: linear
      vertical injection: surface
      category: 0
      hierarchy: 1
      scaling factor: 1.0
      sector: anthropogenic
