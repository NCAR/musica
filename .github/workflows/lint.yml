name: Lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  clang-format:
    name: C/C++ format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # covers the core library and the C++ bindings for every language;
      # the version is pinned to match the format workflow
      - name: Check formatting
        run: |
          files=$(git ls-files 'include/*.h' 'include/*.hpp' 'src/*.c' 'src/*.cpp')
          for dir in python javascript julia; do
            files="$files $(git ls-files "$dir/*.c" "$dir/*.cpp" "$dir/*.h" "$dir/*.hpp")"
          done
          pipx run --spec clang-format==18.1.8 clang-format --dry-run --Werror --style=file $files

  codespell:
    name: Run codespell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: codespell-project/actions-codespell@v2
        with:
          check_hidden: true
          check_filenames: true
          skip: "*.pdf,*.ipynb"
          ignore_words_list: "inout,pres,aer,bui,nd"
