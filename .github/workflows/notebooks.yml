name: Notebooks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  run-notebooks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran cmake \
            libnetcdf-dev libnetcdff-dev liblapack-dev libblas-dev graphviz

      - name: Build and install musica with tutorial dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[tutorial] nbmake
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "4"

      - name: Execute tutorial notebooks
        run: |
          # TODO(miam): MIAM v0.1.0 does not support MICM v3.14.0, so wheels are built without it
          # (pyproject.toml). Remove the five MIAM notebook ignores below once MIAM is ported.
          pytest --nbmake --nbmake-timeout=900 --nbmake-kernel=python3 -v tutorials/ \
            --ignore-glob='*.ipynb_checkpoints*' \
            --ignore-glob='*hpc_parallelization*' \
            --ignore-glob='*gpu_solver*' \
            --ignore-glob='*aerosol_chemistry_intro*' \
            --ignore-glob='*dae_solving_intro*' \
            --ignore-glob='*miam_processes_and_constraints*' \
            --ignore-glob='*cam_cloud_chemistry*' \
            --ignore-glob='*cam_aerosol_distributions*'
