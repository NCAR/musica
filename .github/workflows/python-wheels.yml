name: Python

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  release:
    types:
      - published

jobs:
  build_sdist:
    name: Build SDist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Build SDist
        run: pipx run build --sdist

      - name: Check metadata
        run: pipx run twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  build_musica_data:
    name: Build musica-data wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build wheel
        run: pipx run build --wheel --outdir dist python/musica-data

      - name: Check metadata
        run: pipx run twine check dist/*

      - name: Check the musica-data lower bound of musica
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' python/musica-data/pyproject.toml)
          if ! grep -qF "\"musica-data>=${version}\"" pyproject.toml; then
            echo "::error::Change the musica-data lower bound in pyproject.toml to musica-data>=${version}"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: musica-data
          path: dist/*.whl

  build_wheels:
    name: Build wheels (${{ matrix.os }}, ${{ matrix.cibw_archs }})
    runs-on: ${{ matrix.os }}
    # Default job timeout is 360 min; the slowest legit run (macos-15-intel) takes ~41 min,
    # so 90 min catches a hang (e.g. #960's windows-11-arm 6h stall) with room to spare.
    timeout-minutes: 90
    env:
      ZIPURL: https://raw.githubusercontent.com/pypi/warehouse/refs/heads/main/warehouse/utils/zipfiles.py
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds
          - os: ubuntu-latest
            cibw_archs: "x86_64"

          - os: ubuntu-24.04-arm
            cibw_archs: "aarch64"

          # Windows builds (separate runners needed for different archs)
          - os: windows-latest
            cibw_archs: "AMD64"

          - os: windows-11-arm
            cibw_archs: "ARM64"

          # macOS Intel
          - os: macos-15-intel
            cibw_archs: "x86_64"
            fc: gfortran-15

          # macOS Apple Silicon
          - os: macos-15
            cibw_archs: "arm64"
            fc: gfortran-15

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Windows AMD64
        if: matrix.os == 'windows-latest'
        uses: ./.github/windows_amd64_steps

      - name: Set up Windows ARM64
        if: matrix.os == 'windows-11-arm'
        uses: ./.github/windows_arm64_steps

      - name: CI Build Wheels
        if: startsWith(matrix.os, 'ubuntu') || startsWith(matrix.os, 'macos')
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          FC: ${{ matrix.fc }}

      - name: CI Build Wheels (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: msys2 {0}
        run: |
          MSYS2_PYTHON=$(cygpath -u "$pythonLocation")
          "$MSYS2_PYTHON/python.exe" -m pip install --upgrade pip cibuildwheel
          "$MSYS2_PYTHON/python.exe" -m cibuildwheel
        env:
          CIBW_ARCHS: ${{ matrix.cibw_archs }}

      - name: Validate wheel RECORD integrity
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          python -m pip install --upgrade check-wheel-contents
          # W002: missing top-level __init__, W004: module shadows stdlib, W009/W010: purelib/platlib mix (expected for native extensions)
          check-wheel-contents --ignore W002,W004,W009,W010 wheelhouse/*.whl

          Invoke-WebRequest -Uri $env:ZIPURL -OutFile $env:TEMP\zipfiles.py
          $scriptPath = Join-Path $env:TEMP "zipfiles.py"

          Get-ChildItem wheelhouse\*.whl | ForEach-Object {
              python $scriptPath $_.FullName
          }

      - name: Validate wheel RECORD integrity
        if: startsWith(matrix.os, 'ubuntu') || startsWith(matrix.os, 'macos')
        run: |
          python -m pip install --upgrade check-wheel-contents
          # W002: missing top-level __init__, W004: module shadows stdlib, W009/W010: purelib/platlib mix (expected for native extensions)
          check-wheel-contents --ignore W002,W004,W009,W010 wheelhouse/*.whl

          # Download PyPI's authoritative zipfiles.py validator once
          wget -qO /tmp/zipfiles.py $ZIPURL

          # Validate each wheel individually
          for whl in wheelhouse/*.whl; do
            python /tmp/zipfiles.py "$whl"
          done

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ matrix.cibw_archs }}
          path: wheelhouse/*.whl

  upload_all:
    name: Upload release
    needs: [build_wheels, build_sdist, build_musica_data]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/musica
    permissions:
      id-token: write

    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - uses: actions/download-artifact@v8
        with:
          name: musica-data
          path: dist-musica-data

      - name: Publish musica-data to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-musica-data/

      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
